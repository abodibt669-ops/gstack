<section class="section container">
  <div class="card form-card">
    <h1>{{t:Create your account}}</h1>
    {{alerts}}
    <form method="POST" action="register.php">
      {{csrf}}
      <label for="full_name">{{t:Full name}}</label>
      <input type="text" id="full_name" name="full_name" value="{{full_name}}" maxlength="100" autocomplete="name" required>

      <label for="email">{{t:Email}}</label>
      <input type="email" id="email" name="email" value="{{email}}" maxlength="120" autocomplete="email" required>

      <label for="phone">{{t:Phone}}</label>
      <input type="tel" id="phone" name="phone" value="{{phone}}" pattern="05[0-9]{8}"
             placeholder="05XXXXXXXX" autocomplete="tel" required>

      <label for="password">{{t:Password (min 8 characters)}}</label>
      <input type="password" id="password" name="password" minlength="8" maxlength="200"
             autocomplete="new-password" required>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">{{t:Create account}}</button>
      </div>
      <p class="form-hint">{{t:Already have an account?}} <a href="login.php">{{t:Log in}}</a></p>
    </form>
  </div>
</section>
