<section class="section container">
  {{alerts}}
  <div class="owner-head">
    <h1 class="section-title">My courts</h1>
    <a class="btn btn-primary" href="add_court.php">+ List a court</a>
  </div>

  <div class="stats">
    <div class="stat"><span class="num">{{stat_courts}}</span><span class="lbl">Courts listed</span></div>
    <div class="stat"><span class="num">{{stat_upcoming}}</span><span class="lbl">Upcoming bookings</span></div>
    <div class="stat"><span class="num">{{stat_revenue}}</span><span class="lbl">Earned (SAR)</span></div>
  </div>

  <h2 class="section-title" style="font-size:26px">Your courts</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Court</th><th>Sport</th><th>Location</th><th>Price/hr</th><th>Actions</th></tr></thead>
      <tbody>{{court_rows}}</tbody>
    </table>
  </div>

  <h2 class="section-title" style="font-size:26px;margin-top:36px">Upcoming bookings</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Court</th><th>Player</th><th>Date</th><th>Time</th><th>Total</th><th>Status</th></tr></thead>
      <tbody>{{booking_rows}}</tbody>
    </table>
  </div>
</section>
