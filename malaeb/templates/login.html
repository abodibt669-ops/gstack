<section class="section container">
  <div class="card form-card">
    <h1>{{t:Log in}}</h1>
    {{alerts}}
    <form method="POST" action="login.php">
      {{csrf}}
      <label for="email">{{t:Email}}</label>
      <input type="email" id="email" name="email" value="{{email}}" autocomplete="email" required>

      <label for="password">{{t:Password}}</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">{{t:Log in}}</button>
      </div>
      <p class="form-hint">{{t:New here?}} <a href="register.php">{{t:Create an account}}</a></p>
    </form>
  </div>
</section>
