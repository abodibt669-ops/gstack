<section class="section container">
  <h1 class="section-title">{{t:All courts}}</h1>

  <form class="filter-bar" method="GET" action="courts.php">
    <select name="sport">
      <option value="">{{t:All sports}}</option>
      {{sport_options}}
    </select>
    <input type="number" name="max_price" min="0" placeholder="{{t:Max price (SAR/hr)}}" value="{{max_price}}">
    <button class="btn btn-dark" type="submit">{{t:Filter}}</button>
  </form>

  <div class="grid">
    {{cards}}
  </div>
</section>
