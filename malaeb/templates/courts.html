<section class="section container">
  <h1 class="section-title">All courts</h1>

  <form class="filter-bar" method="GET" action="courts.php">
    <select name="sport">
      <option value="">All sports</option>
      {{sport_options}}
    </select>
    <input type="number" name="max_price" min="0" placeholder="Max price (SAR/hr)" value="{{max_price}}">
    <button class="btn btn-dark" type="submit">Filter</button>
  </form>

  <div class="grid">
    {{cards}}
  </div>
</section>
